<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Air Strike</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div id="scene">
    <div id="shakeWrap">
      <img id="backdrop" alt="" draggable="false" />
      <div id="dim"></div>
    </div>
    <canvas id="fx"></canvas>
    <div id="marker" class="hidden">
      <svg viewBox="0 0 80 80" width="80" height="80">
        <g class="marker-ring">
          <circle cx="40" cy="40" r="26" fill="none" stroke="#ff2d2d" stroke-width="3" />
          <circle cx="40" cy="40" r="4" fill="#ff2d2d" />
          <line x1="40" y1="4" x2="40" y2="18" stroke="#ff2d2d" stroke-width="3" />
          <line x1="40" y1="76" x2="40" y2="62" stroke="#ff2d2d" stroke-width="3" />
          <line x1="4" y1="40" x2="18" y2="40" stroke="#ff2d2d" stroke-width="3" />
          <line x1="76" y1="40" x2="62" y2="40" stroke="#ff2d2d" stroke-width="3" />
        </g>
        <circle class="marker-pulse" cx="40" cy="40" r="26" fill="none" stroke="#ff2d2d" stroke-width="2" />
      </svg>
    </div>
    <div id="crosshair" class="hidden">
      <svg viewBox="0 0 72 72" width="72" height="72">
        <g class="ch-spin">
          <circle cx="36" cy="36" r="22" fill="none" stroke="#ff2d2d" stroke-width="2.5"
                  stroke-dasharray="9 7" stroke-linecap="round" />
        </g>
        <circle cx="36" cy="36" r="22" fill="none" stroke="#ff2d2d" stroke-width="1" opacity="0.45" />
        <circle cx="36" cy="36" r="3" fill="#ff2d2d" />
        <line x1="36" y1="2" x2="36" y2="14" stroke="#ff2d2d" stroke-width="3" />
        <line x1="36" y1="70" x2="36" y2="58" stroke="#ff2d2d" stroke-width="3" />
        <line x1="2" y1="36" x2="14" y2="36" stroke="#ff2d2d" stroke-width="3" />
        <line x1="70" y1="36" x2="58" y2="36" stroke="#ff2d2d" stroke-width="3" />
      </svg>
    </div>
    <div id="flash"></div>
    <div id="hint">左键锁定目标 · Esc / 右键取消</div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
