<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>hermit@corp: ~/projects/omni-app — zsh</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #12161e;
        --panel2: #171c26;
        --border: #232a38;
        --text: #c6cdd8;
        --muted: #6b7484;
        --green: #26d07c;
        --green-dim: #1a8f57;
        --cyan: #4cc9f0;
        --yellow: #e8c15a;
        --red: #f4695f;
        --magenta: #b98cff;
        --font: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
      }

      header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0;
        height: 38px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        user-select: none;
      }
      .title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.2px;
        padding-left: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: var(--font);
      }
      .title em {
        font-style: normal;
        color: var(--muted);
        font-weight: 400;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .spacer {
        flex: 1;
      }
      header .ctrl {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
        padding-right: 8px;
      }
      .chip {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        background: var(--panel2);
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
        transition: all 0.15s;
        font-family: var(--font);
      }
      .chip:hover {
        color: var(--text);
        border-color: var(--green-dim);
      }
      .chip.active {
        color: var(--green);
        border-color: var(--green-dim);
      }
      .chip.on {
        color: #0b0e14;
        background: var(--green);
        border-color: var(--green);
      }
      .titlebar-ctrl {
        display: flex;
        align-items: stretch;
        height: 100%;
        -webkit-app-region: no-drag;
        border-left: 1px solid var(--border);
        margin-left: 4px;
      }
      .tb {
        width: 46px;
        border: none;
        background: transparent;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: default;
        transition: background 0.12s, color 0.12s;
        padding: 0;
      }
      .tb:hover {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
      }
      .tb.close:hover {
        background: #e81123;
        color: #fff;
      }
      .tb:disabled {
        opacity: 0.35;
      }
      .tb svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.2;
      }

      #term {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 14px 16px 8px;
        background:
          linear-gradient(rgba(38, 208, 124, 0.025), rgba(38, 208, 124, 0.025)),
          var(--bg);
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }
      #term::-webkit-scrollbar {
        width: 8px;
      }
      #term::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }
      .ln {
        white-space: pre-wrap;
        word-break: break-all;
        line-height: 1.55;
        min-height: 1em;
      }
      .ln.dim {
        color: var(--muted);
      }
      .ln.ok {
        color: var(--green);
      }
      .ln.warn {
        color: var(--yellow);
      }
      .ln.err {
        color: var(--red);
      }
      .ln.info {
        color: var(--cyan);
      }
      .ln.mag {
        color: var(--magenta);
      }
      .ln.bold {
        font-weight: 700;
        color: var(--green);
      }
      .ln.wrap {
        color: var(--green);
        user-select: none;
      }
      .ln.sep {
        border-top: 1px solid var(--border);
        margin: 6px 0;
      }
      .ln .tag {
        display: inline-block;
        font-size: 10px;
        line-height: 1;
        padding: 2px 5px;
        border-radius: 4px;
        background: rgba(38, 208, 124, 0.12);
        color: var(--green);
        margin-right: 6px;
        vertical-align: 1px;
      }
      .ln .prompt {
        color: var(--green);
        font-weight: 600;
      }
      .ln .cwd {
        color: var(--cyan);
      }
      .ln .tick {
        color: var(--green-dim);
      }
      .ln.blink {
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .bar {
        color: var(--green);
      }
      .bar .fill {
        color: var(--green);
        letter-spacing: 0;
      }
      .bar .pct {
        color: var(--cyan);
      }

      .input-line {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px 10px;
        background: var(--bg);
      }
      .input-line .p {
        color: var(--green);
        font-weight: 600;
        white-space: nowrap;
      }
      .input-line .p .cwdv {
        color: var(--cyan);
        font-weight: 400;
      }
      #cmd {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: var(--font);
        font-size: 13px;
        caret-color: var(--green);
        padding: 2px 0;
      }
      #cmd::placeholder {
        color: var(--muted);
        opacity: 0.5;
      }

      footer {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 5px 16px;
        border-top: 1px solid var(--border);
        background: var(--panel);
        color: var(--muted);
        font-size: 11px;
        user-select: none;
      }
      footer .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 6px rgba(38, 208, 124, 0.7);
        display: inline-block;
        margin-right: 6px;
        vertical-align: 1px;
      }
      footer .kbd {
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
        background: var(--panel2);
        font-size: 10px;
      }
      #actTxt {
        color: var(--green);
        font-size: 11px;
      }
      #actTxt:empty {
        display: none;
      }
      .grow {
        flex: 1;
      }
      @media (max-width: 640px) {
        .traffic,
        .hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <span class="title">hermit@corp: ~/projects/omni-app <em>— zsh — 100x32</em></span>
      <div class="spacer"></div>
      <div class="ctrl">
        <button id="autoBtn" class="chip on" title="空闲时自动模拟后台任务" onclick="toggleAuto()">后台任务</button>
        <button class="chip" onclick="runHelp()">帮助</button>
        <button class="chip" onclick="clearAll()">清屏</button>
      </div>
      <div class="titlebar-ctrl">
        <button class="tb" id="winMin" title="最小化">
          <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
        </button>
        <button class="tb" id="winMax" title="最大化">
          <svg viewBox="0 0 12 12" id="icMax"><path d="M3 3h6v6H3z" /></svg>
          <svg viewBox="0 0 12 12" id="icRestore" style="display:none"><path d="M4 4h6v6H4z M2 8V2h6" /></svg>
        </button>
        <button class="tb close" id="winClose" title="关闭">
          <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
        </button>
      </div>
    </header>

    <div id="term"></div>

    <div class="input-line">
      <span class="p">hermit@corp:<span class="cwdv" id="cwdv">~</span>$</span>
      <input
        id="cmd"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="输入 help 查看可用命令，↑/↓ 翻历史，Tab 补全"
      />
    </div>

    <footer>
      <span><span class="dot"></span><span id="stateTxt">已连接 · 开发环境正常</span></span>
      <span id="actTxt"></span>
      <span class="grownum" id="clock">--:--:--</span>
      <span>会话时长 <b id="uptime">00:00:00</b></span>
      <span class="grow"></span>
      <span class="hint"><span class="kbd">Ctrl</span> C 中断</span>
    </footer>

    <script>
      'use strict'

      // ————— 基础工具 —————
      const $ = (id) => document.getElementById(id)
      const term = $('term')
      const input = $('cmd')
      const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)]
      const hex = (n) => Array.from({ length: n }, () => '0123456789abcdef'[ri(0, 15)]).join('')
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      const isIdle = () => !runner.busy && !runner.typing

      // ————————————— 状态 —————————————
      const state = {
        start: Date.now(),
        cwd: '~',
        tasks: 0,
        commits: 0,
        deployed: 0,
        meetings: 0,
        coffees: 0,
        buildFail: 0,
        history: [],
        histIdx: -1,
        auto: true,
        version: '1.2.4',
      }

      const VFS = {
        '~': { dirs: ['src', 'api', 'docs', 'mock', 'scripts'], files: [['package.json', '4.2K'], ['README.md', '1.1K'], ['tsconfig.json', '612B'], ['.env.mock', 'static']] },
        '~/src': { dirs: ['pages', 'components', 'hooks'], files: [['App.tsx', '18K'], ['main.tsx', '2.4K'], ['router.ts', '5.1K']] },
        '~/api': { dirs: ['rpc'], files: [['server.ts', '26K'], ['types.ts', '7.8K']] },
        '~/docs': { dirs: [], files: [['spec.md', '12K'], ['changelog.md', '3.2K']] },
        '~/mock': { dirs: [], files: [['user.json', '840B'], ['order.json', '2.1K']] },
        '~/scripts': { dirs: [], files: [['release.sh', '1.4K'], ['db-migrate.sh', '2.8K']] },
      }

      // ————————————— 输出渲染 —————————————
      function line(text, cls) {
        const div = document.createElement('div')
        div.className = 'ln' + (cls ? ' ' + cls : '')
        div.textContent = text
        term.appendChild(div)
        term.scrollTop = term.scrollHeight
        return div
      }
      function blank() {
        const div = document.createElement('div')
        div.className = 'ln'
        div.innerHTML = '&nbsp;'
        term.appendChild(div)
        return div
      }

      // 行类型：'l' 普通行、'w' 等待、'bar' 进度条、'wloop' 长驻循环、'none'
      const Runner = {
        busy: false,
        typing: false,
        _abort: false,
        _watchStop: false,
        _queue: [],
        async push(rows) {
          this._queue.push(...Array.isArray(rows) ? rows : [rows])
          if (!this.busy) await this.drain()
        },
        async drain() {
          this.busy = true
          try {
            while (this._queue.length) {
              if (this._abort) {
                this._abort = false
                this._watchStop = false
                this._queue = []
                line('^C', 'warn')
                break
              }
              const row = this._queue.shift()
              if (row.t === 'w') {
                await sleep(row.ms)
              } else if (row.t === 'wloop') {
                let i = 0
                while (!this._abort && !this._watchStop) {
                  const [txt, cls] = row.pool[i % row.pool.length]
                  line((row.time ? `[${ts()}] ` : '') + txt, cls || 'dim')
                  i++
                  await sleep(ri(row.minMs || 1300, row.maxMs || 3200))
                }
                if (this._abort) {
                  this._abort = false
                  this._watchStop = false
                  this._queue = []
                  line('^C 前台进程已终止', 'warn')
                  break
                }
                this._watchStop = false
                line(row.stopLabel || '已停止', 'warn')
              } else if (row.t === 'l') {
                if (row.cls === 'cmd') {
                  const div = document.createElement('div')
                  div.className = 'ln wrap'
                  div.innerHTML = ''
                  const span = document.createElement('span')
                  span.className = 'prompt'
                  span.textContent = '➜'
                  div.appendChild(span)
                  const c = document.createElement('span')
                  c.className = 'cwd'
                  c.textContent = ' ' + state.cwd + ' '
                  div.appendChild(c)
                  const t = document.createElement('span')
                  t.className = 'tick'
                  t.textContent = '❯ '
                  div.appendChild(t)
                  const txt = document.createElement('span')
                  txt.textContent = ''
                  div.appendChild(txt)
                  term.appendChild(div)
                  this.typing = true
                  for (let i = 0; i < row.text.length; i++) {
                    if (this._abort) break
                    txt.innerHTML += escapeHtml(row.text[i])
                    await sleep(row.speed || 9)
                  }
                  this.typing = false
                  term.scrollTop = term.scrollHeight
                } else {
                  line(row.text, row.cls)
                  if (row.delay) await sleep(row.delay)
                }
              } else {
                line(row.text, row.cls)
              }
            }
          } finally {
            this.busy = false
          }
        },
        abort() {
          this._abort = true
        },
        // 新命令输入时结束正在跑的 watch 进程
        stopWatch() {
          this._watchStop = true
        },
      }

      const escapeHtml = (s) =>
        s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))

      // ————————————— 进度条 —————————————
      function progressRow(label, total, stepMs) {
        const rows = []
        const done = (n) => {
          const pct = Math.min(100, Math.round((n / total) * 100))
          const blocks = Math.round((pct / 100) * 22)
          return [
            { t: 'l', text: `${label}  ${'█'.repeat(blocks)}${'░'.repeat(22 - blocks)}  ${String(pct).padStart(3)}%`, cls: 'bar' },
            { t: 'w', ms: stepMs },
          ]
        }
        for (let n = 1; n <= total; n++) rows.push(...done(n))
        rows.push({ t: 'l', text: `${label}  完成  ${'█'.repeat(22)}  100%`, cls: 'ok', delay: 200 })
        return rows
      }

      const ts = () => new Date().toLocaleTimeString('zh-CN', { hour12: false })

      // watch 模式持续刷新的“心跳”日志
      const WATCH_POOL = [
        ['[hmr] 更新 /src/pages/Dashboard.tsx (' + (0.3 + Math.random() * 1.1).toFixed(1) + 's)', 'info'],
        ['[hmr] 更新 /src/components/Chart.tsx (' + (0.2 + Math.random()).toFixed(1) + 's)', 'info'],
        ['[esbuild] Build succeeded (' + (0.4 + Math.random() * 0.8).toFixed(1) + 's)', 'ok'],
        ['[vite] page reload · ' + ri(1, 14) + ' diffs · ' + ri(2, 9) + 'ms', 'info'],
        ['[worker] job #' + hex(4) + ' 完成 · 耗时 ' + ri(3, 48) + 'ms', ''],
        ['[api] 200 GET /api/dashboard · 12ms', 'ok'],
        ['[stream] ' + ri(14, 260) + ' msgs from queue/orders', ''],
        ['[tsc] --noEmit: 0 errors (' + (1 + Math.random() * 2).toFixed(1) + 's)', 'ok'],
        ['[tailwind] 处理 ' + ri(3, 8) + ' 个 class · +' + ri(2, 9) + 'kB', ''],
        ['[compiler] watch: 5 modules created · 2 changed · 1 deleted', ''],
        ['[git] 远端同步完成 · 3 个新 reference', ''],
      ]

      // 后台静默的“系统噪音”日志
      const AMBIENT_POOL = [
        '[cluster] node-0412 alive · replicas=3 · leader=api-0',
        '[queue] 已完成 1,284 条消息 / 10s · 深度 47',
        '[metrics] CPU 42% · MEM 3.2G/16G · DISK 62% · NET 84KB/s',
        '[cron] 备份同步任务已跑 · 128GB · ok',
        '[git] 分支 mock-branch · 与远端同步 +3 commits',
        '[audit] 依赖扫描完成 · 0 critical · 2 moderate',
        '[worker] 34 个容器预热完成 · 91ms',
        '[otel] 已上报 281,412 traces · p95=42ms',
        '[registry] pull omni-app:1.2.4 · 层完整 · 24.5MB',
        '[log] 归档 old-logs 目录 · 释放 1.2GB',
      ]

      // ————————————— 命令表 —————————————
      const CMDS = {
        help: { hint: '本清单', run: (args) => helpRun(args) },
        clear: { hint: '清屏', run: () => { term.innerHTML = ''; return [] } },
        whoami: { hint: '当前用户', run: () => whoamiRun() },
        neofetch: { hint: '系统信息', run: () => neofetchRun() },
        date: { hint: '当前时间', run: () => [{ t: 'l', text: new Date().toLocaleString('zh-CN', { hour12: false }), cls: 'info', delay: 200 }] },
        pwd: { hint: '当前目录', run: () => [{ t: 'l', text: state.cwd, cls: 'info' }] },
        ls: { hint: '列出目录', run: (args) => lsRun() },
        cd: { hint: '切换目录', run: (args) => cdRun(args) },
        git: { hint: 'git 状态/提交/推送', run: (args) => gitRun(args) },
        build: { hint: '构建项目', run: () => buildRun() },
        test: { hint: '跑测试', run: () => testRun() },
        deploy: { hint: '构建并发布', run: () => deployRun() },
        docker: { hint: '容器列表', run: () => dockerRun() },
        pods: { hint: 'k8s 服务状态', run: () => podsRun() },
        curl: { hint: '请求接口', run: (args) => curlRun(args) },
        ping: { hint: 'ping 主机', run: (args) => pingRun(args) },
        meeting: { hint: '参与会议', run: () => meetingRun() },
        standup: { hint: '站会播报', run: () => standupRun() },
        coffee: { hint: '短暂离开', run: () => coffeeRun() },
        code: { hint: '打开文件', run: (args) => codeRun(args) },
        status: { hint: '会话状态', run: () => statusRun() },
        ps: { hint: '进程列表', run: () => psRun() },
        sleep: { hint: '挂起一会', run: (args) => sleepRun(args) },
        jobs: { hint: '排队中的任务', run: () => jobRun() },
        echo: { hint: '回显', run: (args) => [{ t: 'l', text: args.join(' '), cls: 'info' }] },
        dev: { hint: '启动开发服务器(持续运行)', run: () => watchRun() },
        watch: { hint: '同 dev', run: () => watchRun() },
        install: { hint: '安装依赖', run: (args) => installRun(args) },
        ci: { hint: '运行流水线', run: () => ciRun() },
        exit: { hint: '退出终端', run: () => exitRun() },
      }

      // ————— 各命令实现 —————
      const helpRun = (args) => {
        const rows = [
          { t: 'l', text: '可用命令', cls: 'bold' },
          { t: 'l', text: '（仅本地模拟执行，不产生任何副作用）', cls: 'dim' },
          { t: 'l', text: '' },
          ...Object.entries(CMDS).map(([k, v]) => ({ t: 'l', text: `  ${k.padEnd(12)} ${v.hint}`, cls: '' })),
          { t: 'l', text: '' },
          { t: 'l', text: 'Tab 补全 · ↑/↓ 历史 · Ctrl+C 中断 · Ctrl+L 清屏', cls: 'dim' },
        ]
        return rows
      }
      const whoamiRun = () => [
        { t: 'l', text: 'hermit', cls: 'bold' },
        { t: 'l', text: 'uid=1000(hermit) gid=1000(hermit) groups=1000(hermit),27(sudo)', cls: '' },
      ]
      const neofetchRun = () => [
        { t: 'l', text: '        /\\          hermit@corp', cls: '' },
        { t: 'l', text: '       /  \\_        ----------------', cls: '' },
        { t: 'l', text: '      /._.-\\"       OS: macOS 24.5 x86_64', cls: '' },
        { t: 'l', text: '     /_/ \\_\\       Host: MacBook Pro (16-inch, 2023)', cls: '' },
        { t: 'l', text: '                    Kernel: 23.5.0-alask', cls: '' },
        { t: 'l', text: '                    Uptime: ' + fmtDur(Date.now() - state.start) + ' (本会话)', cls: '' },
        { t: 'l', text: '                    Shell: zsh 5.9', cls: '' },
        { t: 'l', text: '                    WM: aqua (dark)', cls: '' },
      ]
      const lsRun = () => {
        const dir = VFS[state.cwd] || { dirs: [], files: [] }
        const rows = []
        dir.dirs.forEach((d) => rows.push({ t: 'l', text: `drwxr-xr-x   ${d}`, cls: 'info' }))
        dir.files.forEach(([f, s]) => rows.push({ t: 'l', text: `-rw-r--r--   ${f.padEnd(22)} ${s}`, cls: '' }))
        if (!rows.length) rows.push({ t: 'l', text: '（目录为空）', cls: 'dim' })
        return rows
      }
      const cdRun = (args) => {
        const target = args[0] || '~'
        if (target === '~' || target === '/') { state.cwd = '~'; return [{ t: 'l', text: '回到项目根目录。', cls: 'dim' }] }
        const next = target.startsWith('~/') ? target : (state.cwd === '~' ? '~/' + target : state.cwd + '/' + target)
        const dir = VFS[next] || VFS[state.cwd + '/' + target]
        if (dir) {
          state.cwd = next

      // ————————————— 命令输入 —————————————
      async function exec(raw) {
        const text = raw.trim()
        const parts = text.split(/\s+/)
        const cmd = parts.shift()
        const args = parts
        if (!cmd) {
          return { rows: [] }
        }
        const C = CMDS[cmd]
        if (C) {
          const rows = await C.run(args)
          return { rows: rows || [] }
        }
        return {
          rows: [
            { t: 'l', text: `bash: ${cmd}: command not found`, cls: 'err' },
            { t: 'l', text: 'Try \'help\' for a list of available commands.', cls: 'dim' },
          ],
        }
      }

      async function onSubmit() {
        Runner.stopWatch()
        const text = input.value

        lastInput = Date.now()
        input.value = ''
        const { rows } = await exec(text)
        Runner.push({ t: 'l', text: text, cls: 'cmd', speed: 8 })
        Runner.push(rows.length ? rows : [{ t: 'w', ms: 120 }])
      }

      function onKey(e) {
        if (e.key === 'Enter') {
          e.preventDefault()
          onSubmit()
        } else if (e.key === 'ArrowUp') {
          e.preventDefault()
          if (state.histIdx > 0) {
            state.histIdx--
            input.value = state.history[state.histIdx] || ''
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault()
          if (state.histIdx < state.history.length) {
            state.histIdx++
            input.value = state.history[state.histIdx] || ''
          }
        } else if (e.key === 'Tab') {
          e.preventDefault()
          const v = input.value
          const parts = v.split(' ')
          const head = parts.pop()
          const names = Object.keys(CMDS)
          const matched = names.filter((n) => n.startsWith(head))
          if (matched.length === 1) {
            parts.push(matched[0])
            input.value = parts.join(' ')
          } else if (matched.length > 1) {
            line(`候选: ${matched.join('  ')}`, 'dim')
          } else if (v.startsWith('git ')) {
            const subs = ['status', 'log', 'commit', 'push', 'merge', 'diff']
            const m = subs.filter((s) => s.startsWith(head))
            if (m.length === 1) input.value = 'git ' + m[0]
            else if (m.length) line(`git 子命令: ${m.join('  ')}`, 'dim')
          }
        } else if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
          Runner.abort()
        } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
          term.innerHTML = ''
        }
      }

        } else {
          el.textContent = ''
        }
      }, 300)

      // ————————————— 启动 —————————————
      async function boot() {
        const last = new Date(state.start - ri(3600_000, 8 * 3600_000)).toLocaleString('zh-CN', { hour12: false })
        line(`Last login: ${last} from 10.0.2.15`, 'dim')
        line('Welcome to Ubuntu 24.04.1 LTS (GNU/Linux 6.8.0-45-generic x86_64)', 'dim')
        line('', '')
        line('  * Documentation:  https://help.ubuntu.com', 'dim')
        line('', '')
        line('  project: omni-app · cwd: ~/projects/omni-app', 'bold')
        line('  输入 help 查看可用命令 · Tab 补全 · Ctrl+C 中断', 'dim')
        line('────────────────────────────────────────────────────', 'dim')
        Runner.push([{ t: 'w', ms: 350 }])
        setTimeout(() => input.focus(), 400)
      }
      boot()
      Runner.push([{ t: 'l', text: '后台任务已开启：空闲时自动模拟构建 / 监控等例行任务', cls: 'dim' }])
      input.addEventListener('keydown', onKey)
    </script>
  </body>
</html>
