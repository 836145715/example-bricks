<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>子窗 RPC 实验室</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header>
        <h1>子窗 RPC 实验室</h1>
        <p class="lede">
          体验窗只负责 <code>start</code> 和开窗。子窗里测 <code>request</code> /
          <code>notify</code> / <code>on</code>。不填 timeout 的 invoke 会一直等到关窗，不应在 30 秒失败。
        </p>
      </header>

      <section class="card">
        <h2>开窗</h2>
        <div class="row">
          <button id="attached" type="button">打开 attached</button>
          <button id="standalone" type="button">打开 standalone</button>
        </div>
        <p id="status" class="status">启动 runtime…</p>
        <ul class="checks">
          <li>attached：子窗先出现；这次 invoke 一直转，关窗才返回。等超过 30 秒也不该 IPC 失败。</li>
          <li>standalone：invoke 马上返回，子窗还在，里面的按钮继续能用。</li>
          <li>子窗顶上很快变成 attached / standalone，tick 数字往上加。</li>
          <li>子窗里点「跑自检」，7 项都应变绿。</li>
        </ul>
      </section>

      <section class="card">
        <h2>体验窗日志</h2>
        <pre id="log" class="log"></pre>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
